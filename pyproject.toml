[project]
name = "retail-media-lab"
version = "0.1.0"
description = "Amazon Ads and AMC-style retail media analytics: path-to-conversion SQL, multi-touch attribution, geo incrementality, a marketing mix model, a budget optimizer and an ads analytics agent. Snowflake-ready SQL, Power BI and Dataiku kits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Reza", email = "faizanreza01@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "openai>=1.40"]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
rml = "rml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
# the dataiku/ folder holds recipes, not the dataiku package
known-third-party = ["dataiku"]

[tool.ruff.lint.per-file-ignores]
# tool descriptions are prose the model reads
"rml/agent/tools.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["rml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
