name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra llm --extra dev
      - name: Lint and type-check
        run: make lint
      - name: Tests
        run: make test
      - name: Build data and analyses
        run: make build
      - name: Agent eval (mock provider)
        run: make eval
      - name: Power BI export
        run: make powerbi
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            data/results.json
            reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t retail-media-lab .
      - name: Smoke test
        run: |
          docker run --rm retail-media-lab python -c "from rml.agent.core import Agent; from rml.agent.provider import MockProvider; r = Agent(MockProvider()).ask('What incremental ROAS did the DSP geo holdout show?'); assert r.tools_used == ['geo_test_results'], r.tools_used; print(r.answer)"
